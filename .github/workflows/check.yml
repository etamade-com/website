name: Validate website
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Build/tests have no third-party runtime dependencies. Deployment is
      # separate and intentionally not triggered by this validation workflow.
      - run: npm test
